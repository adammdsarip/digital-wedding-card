# Netlify configuration
#
# This is a plain static site: no build step, no dependencies to install.
# GSAP is vendored in js/vendor/, so there is nothing to compile — Netlify
# just serves the repository root as-is.
#
# Caching is deliberately left to Netlify's defaults (revalidated HTML,
# ETag'd assets). Wedding details get edited late and often; serving a
# stale config.js to guests is a worse failure than an extra request.

[build]
  publish = "."
  command = ""

# ---- Headers -------------------------------------------------------------
# Camera, microphone, location and payments are switched off: nothing on the
# site uses them.
[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# ---- Keep the working files off the public site --------------------------
# "publish = ." serves the whole repository, so hide what guests should not
# browse to: the build scripts, notes, and tooling folders.
[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.claude/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.agents/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/skills-lock.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.gitignore"
  to = "/404.html"
  status = 404
  force = true
