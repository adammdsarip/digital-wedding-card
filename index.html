<body class="is-locked">

<!-- ============================================================
     AUDIO TOGGLE — persistent, small, corner-mounted
     ============================================================ -->
<button id="audio-toggle" class="audio-toggle" type="button" aria-label="Toggle wedding music" aria-pressed="false">
  <span class="audio-toggle__wave" aria-hidden="true">
    <i></i><i></i><i></i>
  </span>
</button>
<audio id="bg-audio" loop preload="none"></audio>

<!-- ============================================================
     OPENING SEQUENCE — the envelope
     A fixed, full-viewport overlay in three states:
       closed → opening → revealed   (then it hands off to the site)
     Built as separate layers so each one can move on its own:
       1 background · 2 envelope back · 3 lining · 4 card
       5 front pocket · 6 flap · 7 wax seal · 8 light and shadow
     ============================================================ -->
<div id="envelope-scene" class="scene" data-state="closed" role="button" tabindex="0"
     aria-label="Tap to open your wedding invitation">

  <!-- 1 · Background: the supplied photograph, set in CSS -->
  <div class="scene__bg" aria-hidden="true"></div>

  <div class="scene__stage">

    <header class="scene__title" id="scene-title">
      <p class="monogram" aria-hidden="true">
        <span class="monogram__one" id="mono-one">I</span><i></i><span class="monogram__two" id="mono-two">K</span>
      </p>
      <p class="scene__eyebrow" id="scene-eyebrow">A special invitation<br>awaits</p>
    </header>

    <!-- rig: the camera move · tilt: pointer parallax · float: the idle drift -->
    <div class="env-rig" id="env-rig">
      <div class="env-tilt" id="env-tilt">
        <div class="env-float" id="env-float">
          <div class="envelope" id="envelope">

            <div class="env__floor" id="env-floor"></div>

            <!-- 2 + 3 · back of the envelope, and the lining printed inside it -->
            <div class="env__back cotton">
              <div class="env__lining"></div>
            </div>

            <!-- 6 · the flap, hinged along the top edge. Sits above the pocket
                 while closed; drops behind the card once it passes upright. -->
            <div class="env__hinge" id="env-hinge">
              <div class="env__flap" id="env-flap">
                <div class="flap__face flap__face--outer cotton" id="flap-outer">
                  <svg class="flap__foil" viewBox="0 0 1000 441" preserveAspectRatio="none" aria-hidden="true">
                    <path d="M12 4 L20 100 L489 417 Q500 424 511 417 L980 100 L988 4"/>
                  </svg>
                  <svg class="flap__rim" viewBox="0 0 1000 441" preserveAspectRatio="none" aria-hidden="true">
                    <path class="rim-lit" d="M0 1.5 H1000"/>
                    <path class="rim-soft" d="M2 0 L12 107 L486 424"/>
                    <path class="rim-dark" d="M998 0 L988 107 L514 424"/>
                  </svg>
                  <div class="flap__shade" id="flap-shade-out"></div>
                </div>
                <div class="flap__face flap__face--inner cotton" id="flap-inner">
                  <div class="flap__lining"></div>
                  <div class="flap__shade" id="flap-shade-in"></div>
                </div>

                <!-- 7 · the wax seal: the supplied photograph of a gold seal, set on the
                     tip of the flap. It is a child of the flap, so it turns with it. -->
                <div class="seal" id="wax-seal" aria-hidden="true">
                  <img class="seal__shadow" id="seal-shadow" src="assets/images/wax-seal.webp" alt="" decoding="async">
                  <div class="seal__lift">
                    <div class="seal__wax" id="seal-wax">
                      <img class="seal__img" src="assets/images/wax-seal.webp" alt="" decoding="async" fetchpriority="high" width="512" height="485">
                      <div class="seal__shade" id="seal-shade"></div>
                      <div class="seal__shine"><div class="seal__glint" id="seal-glint"></div></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- 4 · the invitation card. The slot clips it at the envelope's
                 bottom edge only, so it can rise freely above the envelope. -->
            <div class="env__slot">
              <div class="card-rig" id="card-rig">
                <div class="card__shadow" id="card-shadow"></div>
                <article class="card paper" id="envelope-card">
                  <div class="card__frame"></div>
                  <svg class="card__spray card__spray--l" aria-hidden="true"><use href="#spray"/></svg>
                  <svg class="card__spray card__spray--r" aria-hidden="true"><use href="#spray"/></svg>
                  <div class="card__body">
                    <p class="monogram monogram--card" aria-hidden="true">
                      <span class="monogram__one" id="card-mono-one">I</span><i></i><span class="monogram__two" id="card-mono-two">K</span>
                    </p>
                    <p class="card__eyebrow" id="card-eyebrow">Together with our families</p>
                    <div class="card__names">
                      <span class="card__name" id="card-name-one">Isz</span>
                      <span class="card__amp"><i></i><em id="card-connector">&amp;</em><i></i></span>
                      <span class="card__name" id="card-name-two">Khaty</span>
                    </div>
                    <p class="card__invite" id="card-invite">Invite you to celebrate<br>our wedding</p>
                    <p class="card__date">
                      <span id="card-weekday">Sat</span><i></i><span class="card__day" id="card-day">14</span><i></i><span id="card-month">Nov 2026</span>
                    </p>
                    <p class="card__place" id="card-place">Singapore</p>
                    <div class="card__divider" aria-hidden="true"><i></i><svg><use href="#ornament"/></svg><i></i></div>
                  </div>
                  <div class="card__sheen" id="card-sheen"></div>
                </article>
              </div>
            </div>

            <!-- 5 · the front pocket: two side flaps under a bottom flap -->
            <div class="env__pocket">
              <div class="pocket__sides cotton"></div>
              <svg class="pocket__fold" viewBox="0 0 1000 700" preserveAspectRatio="none" aria-hidden="true">
                <defs><filter id="fold-blur" filterUnits="userSpaceOnUse" x="-60" y="250" width="1120" height="520"><feGaussianBlur stdDeviation="9"/></filter></defs>
                <path d="M0 651 L490 347 Q500 343 510 347 L1000 651" filter="url(#fold-blur)"/>
              </svg>
              <div class="pocket__bottom cotton"></div>
              <svg class="pocket__edges" viewBox="0 0 1000 700" preserveAspectRatio="none" aria-hidden="true">
                <path class="pocket__edge-light" d="M0 655 L490 351 Q500 347 510 351 L1000 655"/>
              </svg>
            </div>

            <!-- shadows thrown by the flap: resting on the pocket, then lifting off it -->
            <div class="env__flap-contact" id="flap-contact"></div>
            <div class="env__flap-cast" id="flap-cast"></div>

          </div>
        </div>
      </div>
    </div>

    <footer class="scene__cue" id="scene-cue">
      <i class="scene__cue-line"></i>
      <span id="scene-hint">Tap to open</span>
    </footer>
  </div>

  <p class="scene__next" id="scene-next">Tap to view the invitation</p>
</div>

<!-- ============================================================
     THE INVITATION — vertically scrolling experience
     Populated at runtime from js/config.js by js/render.js
     ============================================================ -->
<main id="site" tabindex="-1">

  <!-- 1 — The invitation -->
  <section class="paper-grain sheet sheet--invite" id="invitation" data-florals aria-label="The invitation">
    <div class="arch">
      <p class="invite__eyebrow" data-intro id="inv-eyebrow"></p>
      <p class="invite__invite" data-intro id="inv-invite"></p>

      <h1 class="invite__names" data-intro>
        <span class="invite__name" id="inv-name-one"></span>
        <span class="invite__and" aria-hidden="false"><i></i><em id="inv-connector"></em><i></i></span>
        <span class="invite__name" id="inv-name-two"></span>
      </h1>

      <p class="invite__blessing" data-intro id="inv-blessing"></p>

      <p class="invite__date" data-intro>
        <span class="invite__weekday" id="inv-weekday"></span>
        <span class="invite__day" id="inv-day"></span>
        <span class="invite__month" id="inv-month"></span>
      </p>
      <p class="invite__time" data-intro id="inv-time"></p>

      <div class="invite__venue" data-intro>
        <p class="invite__venue-name" id="inv-venue-name"></p>
        <p class="invite__venue-address" id="inv-venue-address"></p>
      </div>

      <div class="divider" data-intro aria-hidden="true"><i></i><svg><use href="#ornament"/></svg><i></i></div>
      <p class="invite__reception" data-intro id="inv-reception"></p>
      <p class="invite__closing" data-intro id="inv-closing"></p>
    </div>
  </section>

  <!-- 2 — The big day -->
  <section class="paper-grain sheet sheet--framed" id="itinerary" data-florals aria-labelledby="it-title">
    <header class="sheet__head" data-reveal="fade">
      <p class="sheet__kicker" id="it-eyebrow"></p>
      <h2 class="sheet__title" id="it-title"></h2>
      <div class="divider" aria-hidden="true"><i></i><svg><use href="#ornament"/></svg><i></i></div>
      <p class="sheet__kicker sheet__kicker--sub" id="it-subtitle"></p>
    </header>
    <ol class="itinerary" id="it-list"></ol>
  </section>

  <!-- 3 — Location -->
  <section class="paper-grain sheet sheet--framed" id="location" data-florals aria-labelledby="loc-title">
    <header class="sheet__head" data-reveal="fade">
      <h2 class="sheet__title sheet__title--wide" id="loc-title"></h2>
      <div class="divider" aria-hidden="true"><i></i><svg><use href="#ornament"/></svg><i></i></div>
      <p class="loc__venue" id="loc-venue"></p>
      <p class="loc__address" id="loc-address"></p>
    </header>

    <div class="map" data-reveal="scale">
      <iframe id="loc-map" title="Map showing the venue" loading="lazy"
              referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
    </div>
    <a class="pill pill--dark" id="loc-link" target="_blank" rel="noopener" data-reveal="fade">
      <svg aria-hidden="true"><use href="#i-pin"/></svg><span id="loc-link-text"></span>
    </a>

    <div class="divider" aria-hidden="true"><i></i><svg><use href="#ornament"/></svg><i></i></div>

    <h3 class="sheet__kicker" id="gh-title" data-reveal="fade"></h3>
    <ul class="getting" id="gh-list"></ul>
  </section>

  <!-- 4 — RSVP -->
  <section class="paper-grain sheet sheet--framed" id="rsvp" data-florals aria-labelledby="rsvp-title">
    <header class="sheet__head" data-reveal="fade">
      <p class="sheet__kicker" id="rsvp-eyebrow"></p>
      <h2 class="sheet__title sheet__title--xl" id="rsvp-title"></h2>
      <div class="divider" aria-hidden="true"><i></i><svg><use href="#ornament"/></svg><i></i></div>
      <p class="rsvp__deadline" id="rsvp-deadline"></p>
    </header>

    <div class="rsvp__qr" id="rsvp-qr" data-reveal="scale" role="img"></div>
    <p class="rsvp__scan" id="rsvp-scan" data-reveal="fade"></p>
    <p class="rsvp__or" id="rsvp-or" data-reveal="fade"></p>
    <a class="pill pill--line" id="rsvp-link" target="_blank" rel="noopener" data-reveal="fade"></a>

    <ul class="rsvp__legend" data-reveal="fade">
      <li><svg aria-hidden="true"><use href="#i-check"/></svg><span id="rsvp-accepts"></span></li>
      <li><svg aria-hidden="true"><use href="#i-cross"/></svg><span id="rsvp-declines"></span></li>
    </ul>
  </section>

  <!-- 5 — Dress code and a note -->
  <section class="paper-grain sheet sheet--framed" id="dresscode" data-florals aria-labelledby="dc-title">
    <header class="sheet__head" data-reveal="fade">
      <h2 class="sheet__title" id="dc-title"></h2>
      <div class="divider" aria-hidden="true"><i></i><svg><use href="#ornament"/></svg><i></i></div>
      <p class="sheet__kicker" id="dc-style"></p>
    </header>

    <div class="dress" data-reveal="fade">
      <svg class="dress__figures" viewBox="0 0 200 190" role="img" aria-label="A suited figure and a figure in a long dress and headscarf, in the colours below">
        <use href="#fig-man" x="8" y="0" width="84" height="190"/>
        <use href="#fig-woman" x="108" y="0" width="84" height="190"/>
      </svg>
      <ul class="dress__swatches" id="dc-swatches"></ul>
    </div>
    <p class="dress__caption" id="dc-caption" data-reveal="fade"></p>

    <div class="divider" aria-hidden="true"><i></i><svg><use href="#ornament"/></svg><i></i></div>

    <h3 class="sheet__kicker" id="note-title" data-reveal="fade"></h3>
    <p class="note__text" id="note-text" data-reveal="fade"></p>
  </section>

  <!-- 6 — Contact -->
  <section class="paper-grain sheet sheet--framed" id="contact" data-florals aria-labelledby="ct-title">
    <header class="sheet__head" data-reveal="fade">
      <h2 class="sheet__title" id="ct-title"></h2>
      <div class="divider" aria-hidden="true"><i></i><svg><use href="#ornament"/></svg><i></i></div>
      <p class="contact__intro" id="ct-intro"></p>
    </header>

    <div class="contact__people" id="ct-people"></div>

    <div class="divider" aria-hidden="true"><i></i><svg><use href="#ornament"/></svg><i></i></div>

    <h3 class="sheet__kicker" id="fl-title" data-reveal="fade"></h3>
    <p class="contact__share" id="fl-text" data-reveal="fade"></p>
    <ul class="socials" id="fl-socials" data-reveal="fade"></ul>
    <p class="hashtag" id="fl-hashtag" data-reveal="fade"></p>
  </section>

</main>
