<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Isz &amp; Khaty</title>
<meta name="description" content="You are cordially invited to the wedding of Isz &amp; Khaty." />
<meta name="theme-color" content="#f3e3da" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23c2a263'/%3E%3Ccircle cx='32' cy='32' r='23' fill='none' stroke='%237d5f2a' stroke-width='1.5' opacity='.6'/%3E%3Cline x1='40' y1='18' x2='24' y2='46' stroke='%237d5f2a' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Parisienne&display=swap"
  rel="stylesheet"
/>

<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/envelope.css" />
<link rel="stylesheet" href="css/sections.css" />
<link rel="stylesheet" href="css/responsive.css" />
</head>
<body class="is-locked">

<!-- ============================================================
     AUDIO TOGGLE — persistent, small, corner-mounted
     ============================================================ -->
<button id="audio-toggle" class="audio-toggle" aria-label="Toggle wedding music" aria-pressed="false">
  <span class="audio-toggle__wave" aria-hidden="true">
    <i></i><i></i><i></i>
  </span>
</button>
<audio id="bg-audio" loop preload="none"></audio>

<!-- ============================================================
     OPENING SEQUENCE — Scenes 1–6
     A fixed, full-viewport cinematic overlay. Removed from the
     interaction flow once the invitation has been opened.
     ============================================================ -->
<div id="envelope-scene" class="envelope-scene" role="button" tabindex="0"
     aria-label="Tap to open your wedding invitation">

  <div class="envelope-scene__backdrop">
    <div class="backdrop__silk"></div>
    <div class="backdrop__vignette"></div>
    <div class="backdrop__light"></div>
    <svg class="backdrop__bloom backdrop__bloom--tl" viewBox="0 0 130 112" aria-hidden="true"><use href="#babys-breath"/></svg>
    <svg class="backdrop__bloom backdrop__bloom--br" viewBox="0 0 130 112" aria-hidden="true"><use href="#babys-breath"/></svg>
  </div>

  <div class="envelope-scene__stage">

    <div class="envelope" id="envelope">

      <!-- soft contact shadow, breathes independently of the envelope -->
      <div class="envelope__floor-shadow"></div>

      <!-- back panel -->
      <div class="envelope__back paper-grain"></div>

      <!-- pocket front (lower envelope paper, in front of the card) -->
      <div class="envelope__pocket paper-grain">
        <div class="envelope__pocket-seam"></div>
        <svg class="envelope__pocket-folds" viewBox="0 0 1000 688" aria-hidden="true">
          <!-- shadow cast by the folded flap edge resting on the pocket -->
          <path class="envelope__flap-shadow" d="M0 80 L500 442" />
          <path class="envelope__flap-shadow" d="M1000 80 L500 442" />
          <!-- creases of the side panels folded in behind -->
          <path d="M0 372 L336 688" />
          <path d="M1000 372 L664 688" />
        </svg>
      </div>

      <!-- flap, hinged at the top edge -->
      <div class="envelope__flap-perspective">
        <div class="envelope__flap" id="envelope-flap">
          <div class="envelope__flap-face envelope__flap-face--outer paper-grain">
            <!-- gold foil hairline tracing the flap's folded edges -->
            <svg class="envelope__foil-edge" viewBox="0 0 1000 436" aria-hidden="true">
              <path d="M13 76 L500 432 L987 76" />
            </svg>

            <div class="envelope__flap-copy">
              <span class="envelope__eyebrow" id="env-eyebrow">The Wedding Of</span>
              <span class="envelope__name" id="env-name-one">Isz</span>
              <span class="envelope__and">
                <i></i><em id="env-connector">and</em><i></i>
              </span>
              <span class="envelope__name" id="env-name-two">Khaty</span>
              <svg class="envelope__sprig" viewBox="0 0 100 34" aria-hidden="true"><use href="#sprig"/></svg>
            </div>

            <!-- slow sheen that travels across the foil, as printed gold does -->
            <div class="envelope__foil-sheen" id="foil-sheen"></div>
          </div>
          <div class="envelope__flap-face envelope__flap-face--inner"></div>
        </div>
      </div>

      <!-- wax seal -->
      <button class="wax-seal" id="wax-seal" aria-label="Break the wax seal">
        <span class="wax-seal__visual" id="wax-seal-visual">
          <svg viewBox="0 0 100 100" class="wax-seal__emblem" aria-hidden="true">
            <use href="#seal-emblem" />
          </svg>
        </span>
        <span class="wax-seal__half wax-seal__half--left">
          <span class="wax-seal__clone" id="wax-clone-left">
            <svg viewBox="0 0 100 100" class="wax-seal__emblem" aria-hidden="true"><use href="#seal-emblem" /></svg>
          </span>
        </span>
        <span class="wax-seal__half wax-seal__half--right">
          <span class="wax-seal__clone" id="wax-clone-right">
            <svg viewBox="0 0 100 100" class="wax-seal__emblem" aria-hidden="true"><use href="#seal-emblem" /></svg>
          </span>
        </span>
        <span class="wax-seal__fragments" id="wax-fragments">
          <i></i><i></i><i></i><i></i><i></i><i></i>
        </span>
        <span class="wax-seal__sheen"></span>
      </button>

      <p class="envelope__tagline" id="env-tagline">A Beautiful Journey Together</p>
    </div>

    <p class="envelope-scene__hint" id="envelope-hint">Tap to Open</p>
  </div>

  <!-- invitation card: emerges independent of the small envelope footprint -->
  <div class="invitation-card-wrap">
  <div class="invitation-card paper-grain" id="envelope-card">
    <div class="reveal-title">
      <p class="reveal-title__eyebrow" id="title-eyebrow">The Wedding Of</p>
      <h1 class="reveal-title__names">
        <span class="reveal-title__name" id="title-name-one">Isz</span>
        <span class="reveal-title__amp" id="title-connector">and</span>
        <span class="reveal-title__name" id="title-name-two">Khaty</span>
      </h1>
      <div class="reveal-title__rule"><span></span></div>
      <p class="reveal-title__date" id="title-date">15 · May · 2027</p>
      <button class="reveal-title__continue" id="continue-btn">
        <span>Enter the Invitation</span>
        <svg width="14" height="9" viewBox="0 0 14 9" fill="none" aria-hidden="true">
          <path d="M1 1L7 7L13 1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>
  </div>
</div>

            fill="currentColor" font-size="30" text-anchor="middle">K</text>

      <circle cx="20" cy="56" r="7" opacity="0.75"/>

      <circle cx="80" cy="40" r="5.5" opacity="0.55"/>
      <circle cx="14" cy="20" r="5" opacity="0.6"/>
      <circle cx="72" cy="70" r="7" opacity="0.45"/>
      <circle cx="100" cy="26" r="4.5" opacity="0.4"/>

      <circle cx="96" cy="62" r="5" opacity="0.3"/>
      <circle cx="120" cy="44" r="4" opacity="0.25"/>
      <circle cx="62" cy="96" r="4.5" opacity="0.25"/>
      <g stroke="#c9c2ae" stroke-width="1.4" fill="none" opacity="0.35">
        <path d="M34 30 C 50 46, 62 70, 70 100"/>
        <path d="M58 18 C 66 44, 80 62, 104 84"/>
        <path d="M20 56 C 40 70, 52 84, 60 104"/>

    </g>
  
    <!-- ===== Interface icons: 32px grid, line weight set by CSS ===== -->
    <symbol id="i-mosque" viewBox="0 0 32 32">
      <path d="M10 24v-4c0-3.4 2.7-6.2 6-8.2 3.3 2 6 4.800 6 8.200v4"/>

<!-- ============================================================
     THE INVITATION — vertically scrolling experience
     Populated at runtime from js/config.js by js/render.js
     ============================================================ -->
<main id="site">

  <!-- 1 — The invitation -->
  <section class="paper-grain sheet sheet--invite" id="invitation" data-florals aria-label="The invitation">
    <div class="arch">
      <p class="invite__eyebrow" data-intro id="inv-eyebrow"></p>
      <p class="invite__invite" data-intro id="inv-invite"></p>

      <h1 class="invite__names" data-intro>
        <span class="invite__name" id="inv-name-one"></span>
        <span class="invite__and" aria-hidden="false"><i></i><em id="inv-connector"></em><i></i></span>
        <span class="invite__name" id="inv-name-two"></span>
      </h1>

      <p class="invite__blessing" data-intro id="inv-blessing"></p>

      <p class="invite__date" data-intro>
        <span class="invite__weekday" id="inv-weekday"></span>
        <span class="invite__day" id="inv-day"></span>
        <span class="invite__month" id="inv-month"></span>
      </p>
      <p class="invite__time" data-intro id="inv-time"></p>

      <div class="invite__venue" data-intro>
        <p class="invite__venue-name" id="inv-venue-name"></p>
        <p class="invite__venue-address" id="inv-venue-address"></p>
      </div>

      <div class="divider" data-intro aria-hidden="true"><i></i><svg><use href="#ornament"/></svg><i></i></div>
      <p class="invite__reception" data-intro id="inv-reception"></p>
      <p class="invite__closing" data-intro id="inv-closing"></p>
    </div>
  </section>

  <!-- 2 — The big day -->
  <section class="paper-grain sheet sheet--framed" id="itinerary" data-florals aria-labelledby="it-title">
    <header class="sheet__head" data-reveal="fade">
      <p class="sheet__kicker" id="it-eyebrow"></p>
      <h2 class="sheet__title" id="it-title"></h2>
      <div class="divider" aria-hidden="true"><i></i><svg><use href="#ornament"/></svg><i></i></div>
      <p class="sheet__kicker sheet__kicker--sub" id="it-subtitle"></p>
    </header>
    <ol class="itinerary" id="it-list"></ol>
  </section>

  <!-- 3 — Location -->
  <section class="paper-grain sheet sheet--framed" id="location" data-florals aria-labelledby="loc-title">
    <header class="sheet__head" data-reveal="fade">
      <h2 class="sheet__title sheet__title--wide" id="loc-title"></h2>
      <div class="divider" aria-hidden="true"><i></i><svg><use href="#ornament"/></svg><i></i></div>
      <p class="loc__venue" id="loc-venue"></p>
      <p class="loc__address" id="loc-address"></p>
    </header>

    <div class="map" data-reveal="scale">
      <iframe id="loc-map" title="Map showing the venue" loading="lazy"
              referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
    </div>
    <a class="pill pill--dark" id="loc-link" target="_blank" rel="noopener" data-reveal="fade">
      <svg aria-hidden="true"><use href="#i-pin"/></svg><span id="loc-link-text"></span>
    </a>

    <div class="divider" aria-hidden="true"><i></i><svg><use href="#ornament"/></svg><i></i></div>

    <h3 class="sheet__kicker" id="gh-title" data-reveal="fade"></h3>
    <ul class="getting" id="gh-list"></ul>
  </section>

  <!-- 4 — RSVP -->
  <section class="paper-grain sheet sheet--framed" id="rsvp" data-florals aria-labelledby="rsvp-title">
    <header class="sheet__head" data-reveal="fade">
      <p class="sheet__kicker" id="rsvp-eyebrow"></p>
      <h2 class="sheet__title sheet__title--xl" id="rsvp-title"></h2>
      <div class="divider" aria-hidden="true"><i></i><svg><use href="#ornament"/></svg><i></i></div>
      <p class="rsvp__deadline" id="rsvp-deadline"></p>
    </header>

    <div class="rsvp__qr" id="rsvp-qr" data-reveal="scale" role="img"></div>
    <p class="rsvp__scan" id="rsvp-scan" data-reveal="fade"></p>
    <p class="rsvp__or" id="rsvp-or" data-reveal="fade"></p>
    <a class="pill pill--line" id="rsvp-link" target="_blank" rel="noopener" data-reveal="fade"></a>

    <ul class="rsvp__legend" data-reveal="fade">
      <li><svg aria-hidden="true"><use href="#i-check"/></svg><span id="rsvp-accepts"></span></li>
      <li><svg aria-hidden="true"><use href="#i-cross"/></svg><span id="rsvp-declines"></span></li>
    </ul>
  </section>

  <!-- 5 — Dress code and a note -->
  <section class="paper-grain sheet sheet--framed" id="dresscode" data-florals aria-labelledby="dc-title">
    <header class="sheet__head" data-reveal="fade">
      <h2 class="sheet__title" id="dc-title"></h2>
      <div class="divider" aria-hidden="true"><i></i><svg><use href="#ornament"/></svg><i></i></div>
      <p class="sheet__kicker" id="dc-style"></p>
    </header>

    <div class="dress" data-reveal="fade">
      <svg class="dress__figures" viewBox="0 0 200 190" role="img" aria-label="A suited figure and a figure in a long dress and headscarf, in the colours below">
        <use href="#fig-man" x="8" y="0" width="84" height="190"/>
        <use href="#fig-woman" x="108" y="0" width="84" height="190"/>
      </svg>
      <ul class="dress__swatches" id="dc-swatches"></ul>
    </div>
    <p class="dress__caption" id="dc-caption" data-reveal="fade"></p>

    <div class="divider" aria-hidden="true"><i></i><svg><use href="#ornament"/></svg><i></i></div>

    <h3 class="sheet__kicker" id="note-title" data-reveal="fade"></h3>
    <p class="note__text" id="note-text" data-reveal="fade"></p>
  </section>

  <!-- 6 — Contact -->
  <section class="paper-grain sheet sheet--framed" id="contact" data-florals aria-labelledby="ct-title">
    <header class="sheet__head" data-reveal="fade">
      <h2 class="sheet__title" id="ct-title"></h2>
      <div class="divider" aria-hidden="true"><i></i><svg><use href="#ornament"/></svg><i></i></div>
      <p class="contact__intro" id="ct-intro"></p>
    </header>

    <div class="contact__people" id="ct-people"></div>

    <div class="divider" aria-hidden="true"><i></i><svg><use href="#ornament"/></svg><i></i></div>

    <h3 class="sheet__kicker" id="fl-title" data-reveal="fade"></h3>
    <p class="contact__share" id="fl-text" data-reveal="fade"></p>
    <ul class="socials" id="fl-socials" data-reveal="fade"></ul>
    <p class="hashtag" id="fl-hashtag" data-reveal="fade"></p>
  </section>

</main>
