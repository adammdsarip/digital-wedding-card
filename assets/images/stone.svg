<svg xmlns="http://www.w3.org/2000/svg" width="520" height="520" viewBox="0 0 520 520">
  <!-- Honed limestone: broad mottling plus a fine, lit surface tooth.
       Rendered once by the browser and tiled; never animated. -->
  <filter id="mottle" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.0075 0.011" numOctaves="4" seed="9" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.33  0 0 0 0 0.22  0.9 0 0 0 -0.32"/>
  </filter>
  <filter id="tooth" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3" stitchTiles="stitch" result="n"/>
    <feDiffuseLighting in="n" surfaceScale="1.4" diffuseConstant="1" lighting-color="#fff" result="l">
      <feDistantLight azimuth="225" elevation="52"/>
    </feDiffuseLighting>
    <feColorMatrix type="matrix" values="0 0 0 0 0.3  0 0 0 0 0.24  0 0 0 0 0.17  -1.2 0 0 0 1.05"/>
  </filter>
  <rect width="520" height="520" filter="url(#mottle)"/>
  <rect width="520" height="520" filter="url(#tooth)" opacity=".55"/>
</svg>
