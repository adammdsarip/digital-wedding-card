<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- Cotton paper: a soft cloud of pulp plus a fine, lit tooth. Multiplied over the paper colour. -->
  <filter id="pulp" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="3" seed="5" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.4  0 0 0 0 0.33  0 0 0 0 0.24  0.16 0 0 0 -0.05"/>
  </filter>
  <filter id="tooth" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" seed="12" stitchTiles="stitch" result="n"/>
    <feDiffuseLighting in="n" surfaceScale="0.7" diffuseConstant="1" lighting-color="#fff">
      <feDistantLight azimuth="225" elevation="60"/>
    </feDiffuseLighting>
    <feColorMatrix type="matrix" values="0 0 0 0 0.3  0 0 0 0 0.25  0 0 0 0 0.18  -0.9 0 0 0 0.84"/>
  </filter>
  <rect width="240" height="240" filter="url(#pulp)"/>
  <rect width="240" height="240" filter="url(#tooth)" opacity=".45"/>
</svg>
